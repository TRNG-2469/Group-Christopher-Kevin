<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register User</title>
    </head>

    <body>
        <form action="/[placeholder]" method="PUT">
            <div class="form-field">
                <label for="username">Username: </label>
                <input id="username" type="text" required>
            </div>
            <div class="form-field">
                <label for="password">Password: </label>
                <input id="password" type="text" required>
            </div>
            <div class="form-field">
                <label for="first-name">First Name: </label>
                <input id="first-name" type="text" required>
            </div>
            <div class="form-field">
                <label for="last-name">Last Name: </label>
                <input id="last-name" type="text" required>
            </div>
            <div class="form-field">
                <label for="role">Roles: </label>
                <select id="role">
                    <option value="employee">Employee</option>
                    <option value="manager">Manager</option>
                </select>
            </div>
            <div class="form-field">
                <label for="departments">Department: </label>
                <select id="departments">
                    <option value="">...</option>
                </select>
            </div>

        </form>
    </body>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const dropdown = document.getElementById("departments");

            // Call Javalin API endpoint
            fetch("/departments")
                .then(response => {
                    if(!response.ok){
                        throw new Error("Fuck you");
                    }
                    return response.json();
                })
                .then(data => {
                    // Disable filler option
                    dropdown.innerHTML = '<option value="" disabled>...</option>';

                    // Build actual option
                    let options = "";
                    data.forEach(item => {
                        options += '<option value="${item.id}">${item.name}</option>';
                    })
                    dropdown.innerHTML += options;
                })
                .catch(error => {
                    console.error("Fetch failed: ", error);
                    dropdown.innerHTML += '<option value=""> Failed to load. </option>';
                });
        });
    </script>
</html>
